name: pdos

x-api-image: &api-image
  image: "pdos-api:${PDOS_IMAGE_TAG:?PDOS_IMAGE_TAG must be set}"
  build:
    context: .
    dockerfile: server/Dockerfile
    args:
      PYTHON_BASE_IMAGE: "${PDOS_PYTHON_BASE_IMAGE:-python:3.12.10-slim-bookworm@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db}"
      UV_BASE_IMAGE: "${PDOS_UV_BASE_IMAGE:-ghcr.io/astral-sh/uv:0.11.7@sha256:240fb85ab0f263ef12f492d8476aa3a2e4e1e333f7d67fbdd923d00a506a516a}"
      UV_DEFAULT_INDEX: "${PDOS_UV_DEFAULT_INDEX:-https://pypi.org/simple}"

x-service-hardening: &service-hardening
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-file: "3"
      max-size: 10m

services:
  migrate:
    <<: [*api-image, *service-hardening]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
    read_only: true
    restart: "no"
    tmpfs:
      - /tmp

  api:
    <<: [*api-image, *service-hardening]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-30}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-pdos-web}"
      JWT_ISSUER: "${JWT_ISSUER:-pdos-api}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

  web:
    <<: *service-hardening
    image: "pdos-web:${PDOS_IMAGE_TAG:?PDOS_IMAGE_TAG must be set}"
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: "${PDOS_NODE_BASE_IMAGE:-node:22.22.0-bookworm-slim@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PDOS_API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"
    restart: unless-stopped
    stop_grace_period: 20s
