name: pdos

services:
  searxng:
    profiles: [research]
    image: docker.io/searxng/searxng@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    environment:
      SEARXNG_SECRET: ${PDOS_SEARXNG_SECRET:-local-development-replaced-by-SEARXNG_SECRET}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - pdos-searxng-cache:/var/cache/searxng
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: pdos
      POSTGRES_PASSWORD: pdos
      POSTGRES_USER: pdos
    ports:
      - "127.0.0.1:${PDOS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pdos-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=pdos --dbname=pdos"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - pdos-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  pdos-searxng-cache:
  pdos-minio-data:
  pdos-postgres-data:
