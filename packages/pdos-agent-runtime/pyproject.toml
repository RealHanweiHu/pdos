[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdos-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-postgres>=3.1.2",
  "temporalio>=1.34.0",
  "psycopg[binary]>=3.3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdos_agent_runtime"]

