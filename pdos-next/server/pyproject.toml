[project]
name = "pdos-next-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pdos-agent-runtime",
  "alembic>=1.18,<2",
  "fastapi>=0.135,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.12,<3",
  "uvicorn>=0.42,<1",
  "langgraph>=1.1,<2",
  "temporalio>=1.34.0",
  "langgraph-checkpoint-postgres>=3.1.2",
  "httpx>=0.28.1",
  "boto3>=1.43.107",
  "pypdf>=6.19.0",
  "openpyxl>=3.1.5",
  "PyYAML>=6,<7",
  "alibabacloud-kms20160120>=2,<3",
  "alibabacloud-credentials>=1,<2",
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "mcp>=1.30,<2",
]
[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.15,<1"]
[tool.uv]
package = false

[tool.uv.sources]
pdos-agent-runtime = { path = "../../packages/pdos-agent-runtime" }
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"migrations/schema_0001.py" = ["E501"]
