# Local supporting services for pdos-next.
# The project name stays "pdos" so the container keeps its name, pdos-searxng-1.
#   docker compose -f infra/compose.yaml --profile research up -d searxng
name: pdos

services:
  searxng:
    profiles: [research]
    image: docker.io/searxng/searxng@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    environment:
      SEARXNG_SECRET: ${PDOS_SEARXNG_SECRET:-local-development-replaced-by-SEARXNG_SECRET}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - pdos-searxng-cache:/var/cache/searxng
    restart: unless-stopped

volumes:
  pdos-searxng-cache:
